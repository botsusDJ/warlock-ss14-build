# _Warlock
# Пул карт билда. Ванильные станции убраны из ротации — они рассчитаны на Нанотрейзен,
# которого в билде нет. Сами файлы карт на месте: их можно поднять руками из консоли,
# а дев- и тест-карты грузятся мимо пула и не затронуты.
- type: gameMapPool
  id: DefaultMapPool
  maps:
  - WarlockDesert
  - WarlockTestingGrounds

# _Warlock
# Лоадауты гильдий Варлок, Фактос и Технос.
#
# Раньше их в лобби не было вовсе, и на вкладке снаряжения игроку предлагали ванильные
# церковные рясы — к гильдиям они отношения не имеют и выглядят чужеродно.
#
# Идентификатор роли задан правилом движка: имя прототипа лоадаута — это «Job» плюс id
# должности целиком. Отсюда двойной Job в JobWarlockJobWarlockPriest — так и должно быть.
#
# Логика выбора облачения: ступень, положенная роли, идёт первой в списке и достаётся
# по умолчанию. Ниже — то, на что роль имеет право поменять. Боевое облачение доступно
# всем, потому что лезть в пещеры приходится всем.


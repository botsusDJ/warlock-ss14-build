# _Warlock
# Лоадауты гильдий Варлок и Фактос.
#
# Раньше их в лобби не было вовсе, и на вкладке снаряжения игроку предлагали ванильные
# церковные рясы — к гильдиям они отношения не имеют и выглядят чужеродно. Здесь свои
# облачения, капюшоны и мантии, включая лордские.
#
# Идентификатор роли задан правилом движка: имя прототипа лоадаута — это «Job» плюс id
# должности целиком. Отсюда двойной Job в JobWarlockJobWarlockPriest — так и должно быть.

# ================================================================================================
# Отдельные предметы
# ================================================================================================

# --- Варлок
- type: loadout
  id: WarlockLoadoutWarlockUniform
  equipment:
    jumpsuit: WarlockUniformGuildWarlock

- type: loadout
  id: WarlockLoadoutWarlockHood
  equipment:
    head: WarlockHeadGuildWarlock

- type: loadout
  id: WarlockLoadoutWarlockRobe
  equipment:
    outerClothing: WarlockOuterGuildWarlock

- type: loadout
  id: WarlockLoadoutWarlockLordRobe
  equipment:
    outerClothing: WarlockOuterGuildWarlockLord

- type: loadout
  id: WarlockLoadoutWarlockSymbol
  equipment:
    neck: WarlockSymbolKass

# --- Фактос
- type: loadout
  id: WarlockLoadoutFactosUniform
  equipment:
    jumpsuit: WarlockUniformGuildFactos

- type: loadout
  id: WarlockLoadoutFactosHood
  equipment:
    head: WarlockHeadGuildFactos

- type: loadout
  id: WarlockLoadoutFactosRobe
  equipment:
    outerClothing: WarlockOuterGuildFactos

- type: loadout
  id: WarlockLoadoutFactosLordRobe
  equipment:
    outerClothing: WarlockOuterGuildFactosLord

# --- Общее
- type: loadout
  id: WarlockLoadoutShoesBlack
  equipment:
    shoes: ClothingShoesColorBlack

- type: loadout
  id: WarlockLoadoutShoesBrown
  equipment:
    shoes: ClothingShoesColorBrown

# ================================================================================================
# Группы выбора
#
# minLimit 1 там, где без предмета выходить нельзя: облачение и обувь. Мантия и капюшон
# необязательны — кто-то предпочтёт ходить в одном комбинезоне.
# ================================================================================================
- type: loadoutGroup
  id: WarlockGroupWarlockUniform
  name: loadout-group-warlock-uniform
  minLimit: 1
  maxLimit: 1
  loadouts:
  - WarlockLoadoutWarlockUniform

- type: loadoutGroup
  id: WarlockGroupWarlockHead
  name: loadout-group-warlock-head
  minLimit: 0
  maxLimit: 1
  loadouts:
  - WarlockLoadoutWarlockHood

- type: loadoutGroup
  id: WarlockGroupWarlockOuter
  name: loadout-group-warlock-outer
  minLimit: 0
  maxLimit: 1
  loadouts:

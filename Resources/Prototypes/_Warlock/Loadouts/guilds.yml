  minLimit: 0
  maxLimit: 1
  loadouts:
  - WarlockLoadoutWarlockLordRobe
  - WarlockLoadoutWarlockRobe

- type: loadoutGroup
  id: WarlockGroupWarlockNeck
  name: loadout-group-warlock-neck
  minLimit: 0
  maxLimit: 1
  loadouts:
  - WarlockLoadoutWarlockSymbol

- type: loadoutGroup
  id: WarlockGroupFactosUniform
  name: loadout-group-warlock-uniform
  minLimit: 1
  maxLimit: 1
  loadouts:
  - WarlockLoadoutFactosUniform

- type: loadoutGroup
  id: WarlockGroupFactosHead
  name: loadout-group-warlock-head
  minLimit: 0
  maxLimit: 1
  loadouts:
  - WarlockLoadoutFactosHood

- type: loadoutGroup
  id: WarlockGroupFactosOuter

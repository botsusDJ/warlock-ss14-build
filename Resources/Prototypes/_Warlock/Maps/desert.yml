# _Warlock
# Основная карта: пустыня.
#
# Сама карта собирается скриптом Tools/_Warlock/gen_desert.py. Править desert.yml руками
# бессмысленно: следующий прогон скрипта затрёт правку. Планировка живёт в скрипте
# прямоугольниками комнат, стены и двери он расставляет сам.
#
# Гравитация задана гриду напрямую (Gravity, inherent: True), а не генератору.
# Генератор гравитации и газовые шахты всё равно стоят — в технической пристройке
# в стороне от боевой части карты, — но обесточить или взорвать всю станцию в невесомость
# нельзя. Воздух планетный, из MapAtmosphere, как на любой планетной карте.
#
# Что где:
#   северо-запад  — комплекс гильдии Варлок. Собран храмом, а не коробкой: привратная
#                   с единственным входом, длинный неф, три поперечных коридора,
#                   крылья с комнатами, покои старших вокруг святилища и восьмигранная
#                   апсида с тремя алтарями наверху. Комнаты артефактов внутри нет.
#   юго-запад     — лагерь Технос: общий зал и два жилых блока
#   восток        — лагерь Фактос: то же самое
#   запад, сбоку  — техническая пристройка: генератор гравитации, кислородная
#                   и азотная шахты, свой РТГ
#   центр         — залежи. Сплошной массив породы с прогрызенными ходами.
#   северо-восток — пещера фанатиков Касса: стражи нет, лежат пять диких артефактов
#   юго-восток    — пещера к-хритов: скорпионы, скарабеи и пять их артефактов
#
# Мест ровно тридцать, по десять на гильдию:
#   глава 1, второй 1, дальше по двое на каждую из четырёх оставшихся ролей.

# Прототип станции. Ванильный StandardNanotrasenStation тянет прибытие, эвакуацию, центком,
# снабжение и экспедиции — ничего этого здесь нет, и подсистемы начнут искать чужие карты.
- type: entity
  id: WarlockDesertStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  - BaseStationAllEventsEligible
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform

- type: gameMap
  id: WarlockDesert
  mapName: 'Warlock Desert'
  mapPath: /Maps/_Warlock/desert.yml
  minPlayers: 0
  maxPlayers: 30
  stations:
    WarlockDesert:
      stationProto: WarlockDesertStation
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Пустошь'
      - type: StationJobs
        availableJobs:
          # Гильдия Варлок — десять мест
          WarlockJobWarlockArchmageBishop: [ 1, 1 ]
          WarlockJobWarlockHighPriest: [ 1, 1 ]
          WarlockJobWarlockPriest: [ 2, 2 ]
          WarlockJobWarlockRitualist: [ 2, 2 ]
          WarlockJobWarlockMage: [ 2, 2 ]
          WarlockJobWarlockAdept: [ 2, 2 ]

          # Гильдия Технос — десять мест
          WarlockJobTechnosArchtechnomage: [ 1, 1 ]
          WarlockJobTechnosSupremeTechnocrat: [ 1, 1 ]
          WarlockJobTechnosTechnosorcerer: [ 2, 2 ]
          WarlockJobTechnosTechnomancer: [ 2, 2 ]
          WarlockJobTechnosMage: [ 2, 2 ]
          WarlockJobTechnosAdept: [ 2, 2 ]

          # Гильдия Фактос — десять мест
          WarlockJobFactosArtarchmage: [ 1, 1 ]
          WarlockJobFactosGreatSeeker: [ 1, 1 ]
          WarlockJobFactosSorcerer: [ 2, 2 ]
          WarlockJobFactosEnchanter: [ 2, 2 ]
          WarlockJobFactosMage: [ 2, 2 ]
          WarlockJobFactosAdept: [ 2, 2 ]

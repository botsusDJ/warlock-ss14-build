# _Warlock
# Палитра оттенков для малых артефактов.
#
# RandomSprite не принимает цвет напрямую — только идентификатор палитры, из которой он
# сам вытянет случайный цвет. Восемь оттенков подобраны так, чтобы камни читались как
# разные породы, а не как один и тот же камень под цветным фильтром: тёплый золотой
# от к-хритов, холодный костяной от Касса и несколько нейтральных минеральных.

- type: palette
  id: WarlockRelicPalette
  name: оттенки реликвий
  colors:
    amber: "#e8c46a"
    bone: "#d8d2bd"
    rust: "#b0603a"
    ash: "#8d8d94"
    jade: "#6fa07a"
    ink: "#5a5f7d"
    flesh: "#c08a7a"
    void: "#4a4453"

# _Warlock
# Иконки ролей над головой.
#
# У трёх гильдий иконки свои. Все три рисует Tools/_Warlock/gen_job_icons.py,
# лежат в _Warlock/Interface/Misc/*_job_icons.rsi:
#
#   Варлок — чёрная молния на золоте
#   Фактос — глаз с фиолетовой радужкой на тёмно-сером
#   Технос — белая шестерня на сером
#
# Ранг в каждой читается двумя способами сразу: цветом рамки (от тусклой у младших
# до почти белой у главы) и деталями глифа. Одного признака на восьми пикселях мало —
# рамку видно в общем списке, детали глифа только вблизи.
#
# У Братства Стали и Королевства унатхов пока плейсхолдеры из ванильного job_icons.rsi,
# подобранные по смыслу: синдикатовские для Братства, охранные для унатхов.


# _Warlock
# Каталог гримуаров: что лежит в книгах, в каком разделе, почём и кому.
#
# Заклинания больше не выдаются расой — всё покупается здесь за очки. Очков заведомо
# меньше, чем строк в книге, так что выбор настоящий: взяв боевое, вы не возьмёте ролевое.
#
# Раздел определяет доступ, а не силу:
#   рядовые и боевые  — открыты любому члену гильдии;
#   капелланские      — только жрецам, ритуалистам и тем, кто выше;
#   командирские      — только лордам и архимагам.
# Чужак с краденой книгой прочтёт два верхних раздела и упрётся в два нижних.
#
# Поле guilds пустое означает «во всех трёх книгах». У гильдий разная специализация,
# поэтому дорогие и характерные вещи лежат не у всех.


# ================================================================================================
# Второе пополнение каталога
#
# По пять строк в каждый раздел. Цены расставлены так, чтобы книга на шесть очков
# не позволяла взять всё из одного раздела: дешёвое бытовое или одно дорогое боевое.
#
# Гильдийные ограничения расставлены по специализации, а не по силе:
# Технос чинит железо, Фактос читает и считает, Варлок молится и служит.
# ================================================================================================


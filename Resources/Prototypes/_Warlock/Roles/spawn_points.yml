# _Warlock
# Спавн-точки всех ролей билда — то, без чего карту не разметить.
#
# Каждый маркер привязан к своей должности через SpawnPoint.job_id: игрок, выбравший роль,
# появится ровно на нём. Если на карте нет ни одной точки под должность, роль в лобби
# выбрать можно, а зайти нельзя — именно поэтому здесь перечислены все двадцать пять.
#
# Иконки взяты из ванильного Markers/jobs.rsi по смыслу: своих маркеров у нас нет,
# а узнаваемый чужой значок на карте лучше, чем безликий зелёный квадрат.


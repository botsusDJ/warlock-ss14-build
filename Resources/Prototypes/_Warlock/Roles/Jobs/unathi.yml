# _Warlock
# Королевство Унатхи — ящеролюды, отделившиеся от Братства Стали.
# Исповедуют трёх богов (Дьёкт, Атрак, Рузут), держат людей в рабстве и ведут крестовый поход.
#
# Все роли только для унатхов. Электроники своей нет: вместо КПК — костяная бирка с допуском.

# ------------------------------------------------------------------------------------------------
# 1. Король-Жрец
# ------------------------------------------------------------------------------------------------
- type: job
  id: WarlockJobUnathiPriestKing
  name: warlock-job-name-unathi-priest-king
  description: warlock-job-description-unathi-priest-king
  playTimeTracker: WarlockJobUnathiPriestKing
  startingGear: WarlockGearUnathiPriestKing
  icon: WarlockJobIconUnathiPriestKing
  supervisors: warlock-job-supervisors-three-gods
  requirements:
  - !type:SpeciesRequirement
    species:
    - Reptilian
  special:
  - !type:AddComponentSpecial
    components:
    - type: WarlockRank
      rank: 6
      clergy: true
  - !type:AddComponentSpecial
    components:
    - type: WarlockCaste
      caste: Higher
    - type: WarlockArtefactSight
    # Высшая каста двигает вещи не касаясь. Действие общее с ритуалистами
    # гильдии Варлок: приём один и тот же, источник дара разный.
    - type: ActionGrant
      actions:
      - WarlockActionTelekineticGrasp
  access:
  - WarlockUnathi
  - WarlockUnathiCommand

- type: startingGear
  id: WarlockGearUnathiPriestKing
  equipment:
    id: WarlockTagUnathi
    back: ClothingBackpack
    jumpsuit: WarlockUniformUnathi
    outerClothing: WarlockOuterUnathiRoyal
    head: WarlockHeadUnathiHelm
    shoes: ClothingShoesBootsCombat
  storage:
    back:
    - WarlockFetishDjokt
    - WarlockFetishAtrak
    - WarlockFetishRuzut


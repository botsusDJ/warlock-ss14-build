# _Warlock
# Гильдия Фактос — артефакто-любы. Держат опись каждой находки и считают,
# что артефакт нельзя понять, можно только описать. Все роли доступны только техномагам.
#
# Ранги от высшего к низшему. Первые три носят мантию, верхушке достаётся артефакт.

# ------------------------------------------------------------------------------------------------
# 1. Артархимаг
# ------------------------------------------------------------------------------------------------
- type: job
  id: WarlockJobFactosArtarchmage
  name: warlock-job-name-factos-artarchmage
  description: warlock-job-description-factos-artarchmage
  playTimeTracker: WarlockJobFactosArtarchmage
  startingGear: WarlockGearFactosArtarchmage
  icon: WarlockJobIconFactosArtarchmage
  supervisors: warlock-job-supervisors-union
  requirements:
  - !type:SpeciesRequirement
    species:
    - WarlockTechnomancer
  access:
  - WarlockUnion
  - WarlockUnionCommand
  - WarlockFactos

- type: startingGear
  id: WarlockGearFactosArtarchmage
  equipment:
    id: WarlockPdaFactos
    jumpsuit: WarlockUniformGuildFactos
    outerClothing: WarlockOuterGuildFactosLord
    head: WarlockHeadGuildFactos
    shoes: ClothingShoesColorBlack
  storage:
    back:
    - WarlockArtefactFateDie


# _Warlock
# Тело техномага перестроено многолетним антиматериальным облучением:
# радиация и холод ему почти безразличны, но нервная система работает как проводник,
# поэтому электричество бьёт по нему сильнее обычного.

- type: damageModifierSet
  id: WarlockTechnomancer
  coefficients:
    Radiation: 0.4
    Cold: 0.8
    Shock: 1.35
    Cellular: 1.2

# Механизм, переписанный «Литанией Укрепления». Ломать его почти бесполезно:
# именно за это техномаг платит собственной прочностью, и платит навсегда.
- type: damageModifierSet
  id: WarlockBulwark
  coefficients:
    Blunt: 0.15
    Slash: 0.15
    Piercing: 0.15
    Heat: 0.2
    Shock: 0.2
    Structural: 0.1
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Heat: 10

# Панцирь скарабея к-хритов — биотехнология улья, а не броня.
#
# Числа подобраны под порог смерти 50. Кулак бьёт на 5 тупого, ваниль считает урон как
# (урон − flat) × коэффициент, значит при 0.5 один удар доходит как 2.5 — ровно двадцать
# ударов до конца. Кислота и жар идут с двойкой: между ними и кулаком разница вчетверо,
# и это единственная подсказка, которая нужна игроку — скорпиона не бьют, его травят.
#
# Плоских вычетов здесь намеренно нет: они срезают слабые удары в ноль, и обещанные
# двадцать ударов превратились бы в бесконечность.
- type: damageModifierSet
  id: WarlockKhritCarapace
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Structural: 0.3
    Shock: 0.7
    Cold: 0.6
    Caustic: 2.0
    Heat: 2.0

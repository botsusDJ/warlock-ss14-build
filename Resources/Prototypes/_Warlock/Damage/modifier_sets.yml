# _Warlock
# Тело техномага перестроено многолетним антиматериальным облучением:
# радиация и холод ему почти безразличны, но нервная система работает как проводник,
# поэтому электричество бьёт по нему сильнее обычного.

- type: damageModifierSet
  id: WarlockTechnomancer
  coefficients:
    Radiation: 0.4
    Cold: 0.8
    Shock: 1.35
    Cellular: 1.2

# Механизм, переписанный «Литанией Укрепления». Ломать его почти бесполезно:
# именно за это техномаг платит собственной прочностью, и платит навсегда.
- type: damageModifierSet
  id: WarlockBulwark
  coefficients:
    Blunt: 0.15
    Slash: 0.15
    Piercing: 0.15
    Heat: 0.2
    Shock: 0.2
    Structural: 0.1
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Heat: 10

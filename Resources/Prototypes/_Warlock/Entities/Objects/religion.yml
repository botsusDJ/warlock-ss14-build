# _Warlock
# Переносная культовая атрибутика. Сама по себе бесполезна: усиливает и ускоряет молитву
# у святилища своего бога и мешает молиться чужому. Спрайты — плейсхолдеры.

# ------------------------------------------------------------------------------------------------
# Механтехион — Братство Стали
# ------------------------------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: WarlockCodexMechantechion
  name: Свод Механтехиона
  description: >-
    Металлический переплёт с вытравленными допусками, сечениями и схемами. Молитвы в нём
    записаны как регламент технического обслуживания, и Братство не видит здесь разницы.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Specific/Chapel/codexnanotrasimus.rsi
    state: icon
    color: "#c9a06a"
  - type: WarlockHolySymbol
    god: Mechantechion
    powerMultiplier: 1.6
    timeMultiplier: 0.6

- type: entity
  parent: ClothingNeckBase
  id: WarlockSymbolMechantechion
  name: цепь Механтехиона
  description: Шестерня с восемью зубьями на цепи. Носится поверх формы и снимается только с трупа.
  components:
  # Свой спрайт. Цвет уже в графике, красить не надо.
  - type: Sprite
    sprite: _Warlock/Clothing/Neck/symbol_mechantechion.rsi
    state: icon
  - type: Clothing
    sprite: _Warlock/Clothing/Neck/symbol_mechantechion.rsi
    slots: [ neck ]
  - type: WarlockHolySymbol
    god: Mechantechion
    powerMultiplier: 1.3
    timeMultiplier: 0.8

# ------------------------------------------------------------------------------------------------
# Касс — гильдия Варлок
# ------------------------------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: WarlockTabletKass
  name: Скрижаль Касса
  description: >-
    Пластина из материала, который не режется и не плавится. Знаки на ней читаются
    по-разному в зависимости от того, кто смотрит, и гильдия Фактос считает это доказательством.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    state: icon
    color: "#a9e6ff"
  - type: PointLight
    enabled: true
    radius: 1.3
    energy: 0.6
    color: "#a9e6ff"
  - type: WarlockHolySymbol
    god: Kass
    powerMultiplier: 1.6
    timeMultiplier: 0.6

# ------------------------------------------------------------------------------------------------
# Три бога Королевства Унатхи
# ------------------------------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: WarlockFetishDjokt
  name: фетиш Дьёкта
  description: Костяная фигурка с двумя лицами. Какое из них главное, зависит от того, кто спрашивает.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    state: icon
    color: "#e6d08a"
  - type: WarlockHolySymbol
    god: Djokt
    powerMultiplier: 1.6
    timeMultiplier: 0.6

- type: entity
  parent: BaseItem
  id: WarlockFetishAtrak
  name: фетиш Атрака
  description: Клык на жиле, вымоченный в крови. Атрак принимает только то, что взято в честном бою.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    state: icon
    color: "#d84a3a"
  - type: WarlockHolySymbol
    god: Atrak
    powerMultiplier: 1.6
    timeMultiplier: 0.6

- type: entity
  parent: BaseItem
  id: WarlockFetishRuzut
  name: фетиш Рузута
  description: Связка семян и высохшей лозы. Рузут — бог жизни, и потому же бог обмана.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
    state: icon
    color: "#7fd86a"
  - type: WarlockHolySymbol
    god: Ruzut
    powerMultiplier: 1.6
    timeMultiplier: 0.6

- type: entity
  parent: ClothingNeckBase
  id: WarlockSymbolKass
  name: печать Касса
  description: Оттиск ладони с лишним пальцем. Гильдия Варлок носит его как знак принадлежности создателю.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/bling.rsi
    state: icon
    color: "#8fd4ff"
  - type: Clothing
    slots: [ neck ]
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#8fd4ff"
  - type: WarlockHolySymbol
    god: Kass
    powerMultiplier: 1.3
    timeMultiplier: 0.8

# _Warlock
# Малые артефакты со случайным содержимым — замена ванильной ксеноархеологии.
#
# Прототип один. Внешность катает ванильный RandomSprite: тридцать шесть ванильных камней
# на восемь оттенков — 288 сочетаний, повторы в одном раунде почти не встречаются.
# Имя, эффекты и задержку катает WarlockRandomArtefactSystem при появлении на карте.
#
# Спрайты взяты ксеноархеологические намеренно: снаружи это ровно те же камни,
# которые станция привыкла тащить в лабораторию.

- type: entity
  parent: WarlockBaseArtefact
  id: WarlockRelic
  name: реликвия
  description: >-
    Обломок чего-то, что делали не под человеческую руку. Что он умеет, снаружи не понять —
    и понять можно только одним способом.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
    layers:
    - state: ano01
      map: [ "base" ]
  - type: PointLight
    enabled: true
    radius: 1.4
    energy: 0.7
    netsync: false
  - type: WarlockRandomArtefact
    minEffects: 1
    maxEffects: 3
    minDelay: 20
    maxDelay: 90

# _Warlock
# СОБРАНО СКРИПТОМ Tools/_Warlock/gen_mechs.py — ПРАВИТЬ ЗДЕСЬ БЕССМЫСЛЕННО.
# Вся разница между машинами лежит в таблице MECHS в начале скрипта.
#
# Узлы мехов. Сорок штук: по десять на раму.
#
# Числа dirtRate и meltRate — не украшение. Ступня стоит в песке и забивается
# вчетверо быстрее кабины, а реакторный блок плавится быстрее всех, потому что
# и без огня работает горячим. Из-за этого склад запчастей у Братства перекошен:
# ступней надо много, оснований — почти никогда.

- type: entity
  abstract: true
  parent: BaseItem
  id: WarlockBaseMechPart
  description: Узел рамы Братства. Снимается, теряется, плавится и забивается песком.
  components:
  - type: Item
    size: Huge
  - type: Damageable
    damageContainer: Inorganic
  - type: Tag
    tags:
    - WarlockMechPart


# _Warlock
# СОБРАНО СКРИПТОМ Tools/_Warlock/gen_mechs.py — ПРАВИТЬ ЗДЕСЬ БЕССМЫСЛЕННО.
# Вся разница между машинами лежит в таблице MECHS в начале скрипта.
#
# Мехи Братства Стали. Ложатся поверх ванильного BaseMech: пилот, батарея,
# слоты оружия и интерфейс ванильные. Своё — экипаж на двоих, посты, смазка
# и разборные узлы, всё в компоненте WarlockMech.
#
# Спрайты — перекрашенная ваниль из mecha.rsi. Плейсхолдеры.

- type: entity
  parent: BaseMech
  id: WarlockMechMekantek
  name: Мекантек
  description: >-
    Штурмовая рама Братства, сваренная из трёх чужих. Ходит тяжело, разворачивается ещё тяжелее, но то, что оказалось перед ней, обычно уже не имеет значения.
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha.rsi
    color: "#6b6f76"
    layers:
    - state: marauder
      map: [ "enum.MechVisualLayers.Base" ]
  - type: Mech
    baseState: marauder
    openState: marauder-open
    brokenState: marauder-broken
    maxIntegrity: 420
    maxEquipmentAmount: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.1
    baseSprintSpeed: 2.6
  - type: WarlockMech
    class: Mechantek
    maxLubricant: 140
    lubricant: 140
    turnTime: 0.78
    turnAngle: 70
    requiredSlots:
    - hip_l
    - hip_r
    - knee_l
    - knee_r
    - foot_l
    - foot_r
  - type: Damageable
    damageContainer: Inorganic

- type: entity
  parent: BaseStructureDynamic
  id: WarlockMechFrameMekantek
  name: рама «Мекантек»
  description: >-
    Голый несущий каркас. Пока все гнёзда не заняты, это просто железо на ножках.
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/ripley_construction.rsi
    color: "#6b6f76"
    state: ripley_chassis
  - type: WarlockMechFrame
    result: WarlockMechMekantek
    chassis: Mekantek
    slots:
    - cockpit
    - reactor
    - hip_l
    - hip_r
    - knee_l
    - knee_r
    - foot_l
    - foot_r
    - mount_l
    - mount_r
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic


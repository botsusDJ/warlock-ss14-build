# _Warlock
# Печати «Отбрасывания» и «Гнили» убраны из билда.
#
# Идея была в невидимой мине, а на практике она не работала: поставить печать успевал
# только тот, кто и так выигрывал бой, а наступал на неё обычно случайный прохожий.
# Вместо них появилась «Телекинетическая Хватка» — тот же риск подойти вплотную,
# но результат сразу и в ту сторону, в которую целились.
#
# Файл оставлен пустым намеренно: карты и сейвы, где эти прототипы ещё упоминаются,
# должны падать на «неизвестный прототип», а не тихо спавнить что-то другое.

# _Warlock
# Фракция к-хритов.
#
# К-хриты пали за много миллионов лет до всего, что сейчас есть на планете, и их скарабеи
# не застали ни Союз, ни Братство, ни Королевство. Поэтому скорпион не различает,
# кто перед ним: для улья всё, что не улей, — чужое. Друг друга скарабеи не трогают.
#
# Вражда прописана в обе стороны намеренно: ванильные фракции про к-хритов не знают,
# и без встречной записи ксеносы и синдикат проходили бы мимо скорпиона как мимо стены.


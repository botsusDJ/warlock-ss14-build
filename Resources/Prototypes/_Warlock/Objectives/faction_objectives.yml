# _Warlock
# Цели фракций на раунд. Одна цель на фракцию, раскатывается при старте раунда.
#
# Пересечения разрешены намеренно: революция может выпасть всем трём гильдиям сразу,
# две фракции могут одновременно охотиться на одного лорда. Это сюжет, а не поломка.
#
# Отслеживаются только те цели, где есть что считать: сданные в терминал трофеи
# и смерть конкретной должности. Всё остальное — ролевое, решается игроками и админами.

# ================================================================================================
